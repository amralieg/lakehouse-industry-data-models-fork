bundle:
  name: vibe-modeling

# Install-time choices (Lakebase project id, UC catalog name, SQL warehouse
# id) flow into the App via env vars set on the deployer's shell:
# install/install.sh exports VIBE_MODELING_LAKEBASE_PROJECT / _DATABASE_NAME /
# _WAREHOUSE_ID before `databricks bundle deploy`, and the artifacts hook
# below rewrites those values into src/app/.build/app.yml. The Databricks
# Apps `App` resource has no env field at the bundle level, so substitution
# happens at build time, not deploy time. Source src/app/app.yml is never
# modified — only the build output is rewritten.

variables:
  app_name:
    description: "Databricks App resource name (the name shown in the workspace Apps UI). Override via `--var \"app_name=<name>\"` or via install.sh's --app-name flag."
    default: vibe-modeling

sync:
  include:
    - src/app/.build

artifacts:
  default:
    build: install/build_and_render.sh

resources:
  apps:
    vibe-modeling-app:
      name: ${var.app_name}
      description: "Vibe Data Modeling control plane"
      source_code_path: ./src/app/.build
      # No `resources` field by default: a fresh install declares no app
      # resources, so it deploys cleanly on any workspace with no pre-existing
      # UC connection. (An empty `resources: []` is NOT equivalent — the
      # Databricks Terraform provider rejects it with an "inconsistent result"
      # error, since the API returns null for no resources.) The only resource
      # the app ever declares is the USE_CONNECTION grant on the `github_pr` UC
      # connection for the OPTIONAL publish-to-GitHub feature; it is injected by
      # the `github-publish` target below and re-applied on every deploy of that
      # target (the connection must pre-exist — see docs/github-integration-setup.md).
      # NOTE on user_api_scopes: NOT declared here. The iam.* defaults are
      # auto-granted and are NOT valid to declare (a deploy rejects them), and
      # there is no documented user_api_scope for Serving Endpoints. Whether the
      # OBO publish needs an additional scope (and its exact string) is an open
      # question to resolve empirically at the first publish E2E.

# No workspace.host hardcoded — the target workspace is driven by the CLI
# profile passed on the command line. This is what makes the bundle work
# across arbitrary Databricks accounts (AWS/Azure/any workspace) with no
# edits to this file.
#
# Usage:
#   databricks bundle deploy --profile <your-profile>
#   databricks bundle run vibe-modeling-app --profile <your-profile>
targets:
  # Default, portable target. App declares no resources, so a fresh install
  # deploys on any workspace with no pre-existing UC connection. This is the
  # target install/install.sh uses.
  dev:
    mode: development
    default: true
  # Opt-in target for the publish-to-GitHub feature. Use only on a workspace
  # where you have already created the `github_pr` UC HTTP connection
  # (docs/github-integration-setup.md): `databricks bundle deploy --target
  # github-publish --profile <p> --var "app_name=<app>"`. It adds the
  # USE_CONNECTION grant to the app and re-applies it on every deploy of this
  # target. The default `dev` target declares no resources, so this opt-in is a
  # target rather than a CLI flag (an app `resources` list can't be set via
  # --var or env).
  github-publish:
    mode: development
    resources:
      apps:
        vibe-modeling-app:
          resources:
            - name: github_conn
              uc_securable:
                securable_full_name: github_pr
                securable_type: CONNECTION
                permission: USE_CONNECTION
